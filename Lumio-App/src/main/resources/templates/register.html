<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style/register.css" th:href="@{/style/register.css}" />
    <title>S'inscrire</title>
</head>

<body>
    <header></header>
    <section class="register-container"
        style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
        <div class="register-description" style="display: flex; flex-direction: column; align-items: left;">
            <div class="register-logo">EcoShift</div>
            <div class="register-title"></div>
            <div class="register-content"> <span>Optimisez votre énergie, </span><span style="color: green;">réduisez
                    vos coûts</span> </div>
            <div class="register-text-description">Rejoignez des milliers de foyers qui transforment leur consommation
                d'énergie
                en un actif financier et écologique.</div>
            <div class="register-rewards">
                <div></div>
                <div>15% d'économie moyenne annuelle</div>
            </div>
        </div>

        <div class="register-form">
            <div class="form-register-description">
                Rejoignez la révolution énergétique.
            </div>
            <div class="form-register-content">
                <p>Créez votre compte pour commencer l'optimisation. </p>
            </div>
            <form>
                <div>
                    <label for="name">Nom</label> <br />
                    <input type="name" id="name" required />
                </div>
                <div>
                    <label for="email">Email</label> <br />
                    <input type="text" id="email" name="email" required />
                </div>
                <div>
                    <label for="password">Password</label> <br />
                    <input type="password" name="password" required />
                </div>

            </form>
        </div>
    </section>

</body>

</html>
