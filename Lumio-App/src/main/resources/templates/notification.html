<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert</title>
    <link rel="stylesheet" href="../static/style/notification.css" th:href="@{/style/notification.css}" />
</head>
<body>
    <section class="notification-section">
        <div class="notification-logo">  </div>
        <div class="notification-title">Alerte Pic de tension</div>
        <div class="notification-description">Le réseau est saturé. Reportez votre consommation (temps choisi par le modèle sur base de calcul) <br/> pour éviter de payer plus chers.</div>
        <div class=" notification-alert notification-timeRestart">Reportez l'utilisation à (X) heures</div>
        <div class=" notification-alert notification-ignore">Ignorer l'alerte</div>
    </section>
</body>
</html>
