<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lumio</title>
    <link rel="stylesheet" href="../static/style/styles.css" th:href="@{/style/styles.css}" />

        <div class="section-lumio-content">
            <div>
                <h2>Icon <!-- put the Lumio icon here --> </h2>
            </div>

                <p>Economisez jusqu'à 25% par an sur votre facture en optimisant vos usages
                    énérgetiques au bon moment.</p>
            </div>
            <div class="experience-btn">
                <!-- <span>         <img th:src="@{images/cat.jpg}" alt="cat"> </span> -->
                <a th:href="@{/simulator}">Commencez à utiliser l'expérience. <img src="../static/images/direction.png"
                                                                th:src="@{/images/direction.png}"
                                                                alt="direction">
                </a>
            </div>
        </div>
    </section>
<footer>

</footer>
