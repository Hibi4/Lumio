<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire</title>
</head>

<body>
    <header></header>
    <section class="register-container" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
        <div class="register-description" style="display: flex; flex-direction: column; align-items: left;">
            <div class="register-logo">EcoShift</div>
            <div class="register-title"></div>
            <div class="register-content"> <span>Optimisez votre énergie, </span><span style="color: green;">réduisez
                    vos coûts</span> </div>
            <div class="register-text-description">Rejoignez des milliers de foyers qui transforment leur consommation d'énergie
                en un actif financier et écologique.</div>
            <div class="register-rewards">
                <div></div>
                <div>15% d'économie moyenne annuelle</div>
            </div>
        </div>
        
        <div class="register-form">
            <form>
                <label for="email">Email</label>
                <input type="text" id="email" name="email" required>
            </form>
        </div>
    </section>

</body>

</html>
